<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Личный кабинет — АПЕКС АВТО</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f97316'/%3E%3Cpath d='M44.5 23.5l-6.2 6.2-4-4 6.2-6.2a10 10 0 00-13.2 13.2L16.5 43.5a3 3 0 004.2 4.2l10.8-10.8a10 10 0 0013-13.4z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <script>
    (function () {
      var t = localStorage.getItem('apex_theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/app-pages.css" />
</head>
<body data-page="account">
  <div id="siteHeader"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
          <a href="index.html">Главная</a><span>/</span><span>Личный кабинет</span>
        </nav>
        <div class="page-hero__row">
          <div>
            <h1 class="page-hero__title" id="accountHeading">Личный кабинет</h1>
            <p class="page-hero__subtitle" id="accountSub">Ваши данные автомобиля и актуальные статусы записей на сервис.</p>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;" id="accountHeroActions">
            <a href="booking.html" class="btn btn--primary">+ Новая запись</a>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container" id="accountContent">
        <div class="account-grid">
          <div class="panel-card">
            <div class="panel-card__head">
              <h2 class="panel-card__title">Профиль и авто</h2>
              <span class="role-badge role-badge--user" id="accountRoleBadge">USER</span>
            </div>

            <form class="form" id="profileForm">
              <div class="form__group">
                <label class="form__label">Email</label>
                <input type="email" id="profEmail" class="form__input mono" disabled />
              </div>
              <div class="form__group">
                <label for="profName" class="form__label">Имя</label>
                <input type="text" id="profName" class="form__input" required />
              </div>
              <div class="form__group">
                <label for="profPhone" class="form__label">Телефон</label>
                <input type="tel" id="profPhone" class="form__input mono" placeholder="+7 (999) 123-45-67" />
              </div>
              <div class="form__group">
                <label for="profCar" class="form__label">Основной автомобиль</label>
                <input type="text" id="profCar" class="form__input" placeholder="Например, Toyota Camry 2021" />
              </div>
              <button type="submit" class="btn btn--primary btn--full">Сохранить профиль</button>
              <p class="form__status" id="profileStatus"></p>
            </form>
          </div>

          <div class="panel-card">
            <div class="panel-card__head">
              <h2 class="panel-card__title">История моих записей</h2>
              <span class="mono" id="myBookingsCount" style="color: var(--text-muted); font-size:0.85rem;">0</span>
            </div>
            <div class="booking-list" id="myBookingsList">
              <p class="section-desc">Загрузка записей...</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
