<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Прайс-лист услуг — АПЕКС АВТО</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f97316'/%3E%3Cpath d='M44.5 23.5l-6.2 6.2-4-4 6.2-6.2a10 10 0 00-13.2 13.2L16.5 43.5a3 3 0 004.2 4.2l10.8-10.8a10 10 0 0013-13.4z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <script>
    (function () {
      var t = localStorage.getItem('apex_theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/app-pages.css" />
</head>
<body data-page="services">
  <div id="siteHeader"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
          <a href="/">Главная</a><span>/</span><span>Прайс-лист</span>
        </nav>
        <div class="page-hero__row">
          <div>
            <h1 class="page-hero__title">Прайс-лист и каталог работ</h1>
            <p class="page-hero__subtitle">Актуальные цены на слесарный ремонт, плановое ТО и диагностику. Добавляйте услуги в смету в один клик.</p>
          </div>
          <a href="/calculator" class="btn btn--primary">Открыть калькулятор сметы →</a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="catalog-toolbar">
          <div class="tabs" id="categoryTabs" role="tablist"></div>
          <div class="search-box">
            <svg class="search-box__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="serviceSearch" class="search-box__input" placeholder="Поиск: масло, ГРМ, колодки, код..." />
          </div>
        </div>

        <p class="section-desc" id="servicesCountLabel" style="margin-bottom: 14px;"></p>
        <div class="price-table" id="priceTable"></div>

        <div class="section-cta-bar">
          <a href="/calculator" class="btn btn--primary">Рассчитать смету с учётом класса авто →</a>
          <a href="/booking" class="btn btn--outline">Сразу записаться на сервис</a>
        </div>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
